name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push (or on manual dispatch,
# to re-run the upload without waiting for a new commit); pull requests
# only run the test-and-coverage step in ci.yml, with no CodeScene step
# of any kind. This is the only workflow in the repository that may
# touch CodeScene: it is not a pull-request lane, so a move in the
# unpinned CodeScene CLI can delay a coverage report here but cannot
# block a merge. This workflow also advances the coverage ratchet baseline:
# caches saved on main are readable by every pull-request run, so the
# baseline written here is the one ci.yml's ratchet check compares
# against.

'on':
  push:
    branches: [main]
  workflow_dispatch:

# One publisher at a time, and never cancelled. Two pushes to main in quick
# succession would otherwise upload concurrently and advance the ratchet
# baseline from whichever finished last, which is not necessarily the later
# commit. `cancel-in-progress` is deliberately false: a cancelled run here
# leaves the baseline reflecting a commit that is no longer the tip, and
# nothing reports that.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # A push lane, so Ubicloud rather than GitHub-hosted. It waited 691 s for
    # a runner on 2026-09-16 to do 174 s of work, the worst queue-to-work
    # ratio in the repository. There is no fork arm: neither `push` nor
    # `workflow_dispatch` carries a pull request, so the guard would be
    # constant here and a constant guard reads as a decision nobody made.
    #
    # Two vCPU, unlike `ci.yml`. This lane runs the coverage suite and
    # nothing else, nobody waits on it, and the arithmetic on the one hazard
    # that cares about core count works out: the two trybuild cases take
    # 20.5 s and 25.4 s here on four vCPU, and nextest kills a test at 180 s
    # by default. Even at three times slower they stay under half the kill.
    # Should that stop being true the remedy is `ubicloud-standard-4`, as on
    # `ci.yml`, not a longer deadline for the test.
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      - name: Upload coverage data to CodeScene
        # The ref guard matters as much as the token. `workflow_dispatch` can
        # be run from any branch, and CodeScene accepts an upload for the
        # analysed branch whatever the payload actually came from, so a
        # dispatch from a feature branch would publish that branch's coverage
        # as the trunk's and move the ratchet baseline with it. Nothing would
        # report it.
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: lcov
          # Stated rather than left to the action's default, because this
          # being the upload and not the pull-request check is the whole
          # point of the split.
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
