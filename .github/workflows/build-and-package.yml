---
name: Build and Package

'on':
  workflow_call:
    inputs:
      platform:
        description: Target platform identifier (linux, macos, or freebsd)
        required: true
        type: string
      runner:
        description: Runner label that should execute the job
        required: true
        type: string
      target:
        description: Rust target triple to compile for
        required: true
        type: string
      version:
        description: Version string used for packaging
        required: true
        type: string
      artifact-name:
        description: Name used when uploading workflow artefacts
        required: true
        type: string
      should-upload-workflow-artifacts:
        description: Whether workflow artefacts should be uploaded
        required: true
        type: boolean
      artifact-suffix:
        description: Suffix appended to macOS package filenames
        required: false
        type: string

jobs:
  build:
    name: Build ${{ inputs.platform }} artefacts
    # The runner is the caller's decision, not this workflow's: one job
    # definition serves Linux, macOS and FreeBSD cross builds, and only the
    # caller knows which. `release.yml` passes the reviewed labels, and
    # `tests/workflow_contracts/ci_runner_placement_test.py` pins them there.
    runs-on: ${{ inputs.runner }}
    # One ceiling for all three platforms, sized for the slowest leg rather
    # than per platform, because there is one job here and not three. The
    # macOS builds took 343 s and 305 s on 2026-09-16 and the Linux builds
    # 198 s and 219 s, so 30 minutes leaves room for a cold cache on the
    # slowest without being so wide that a hung build bills for hours.
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      MAINTAINER: "Payton McIntosh <pmcintosh@df12.net>"
      HOMEPAGE: "https://df12.studio/docs.html"
      DESCRIPTION: "Semantic editor"
      MAC_IDENTIFIER: "net.df12.weaver"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        # v7.0.0

      - name: Install uv
        if: inputs.platform != 'linux'
        uses: astral-sh/setup-uv@4cda7d73322c50eac316ad623a716f09a2db2ac7
        # v3.1.2
        with:
          python-version: '3.11'

      # Ubicloud's cache proxy, published before sccache is configured. See
      # the note in ci.yml; the guard is needed because this lane's runner is
      # the caller's choice and may be GitHub-hosted, where the action fails
      # closed by design.
      - name: Export Ubicloud cache credentials
        if: runner.environment == 'self-hosted'
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9

      # Build weaver-cli
      - name: Build weaver-cli release binary
        uses: leynos/shared-actions/.github/actions/rust-build-release@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          target: ${{ inputs.target }}
          bin-name: weaver
          manifest-path: crates/weaver-cli/Cargo.toml

      # Build weaverd
      - name: Build weaverd release binary
        uses: leynos/shared-actions/.github/actions/rust-build-release@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          target: ${{ inputs.target }}
          bin-name: weaverd
          manifest-path: crates/weaverd/Cargo.toml

      # Linux packaging
      - name: Package weaver-cli for Linux
        if: inputs.platform == 'linux'
        uses: leynos/shared-actions/.github/actions/linux-packages@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          project-dir: .
          package-name: weaver-cli
          bin-name: weaver
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          formats: deb,rpm
          maintainer: ${{ env.MAINTAINER }}
          homepage: ${{ env.HOMEPAGE }}
          description: ${{ env.DESCRIPTION }} - CLI client
          license: ISC
          man-paths: target/generated-man/${{ inputs.target }}/release/weaver.1
          outdir: dist

      - name: Package weaverd for Linux
        if: inputs.platform == 'linux'
        uses: leynos/shared-actions/.github/actions/linux-packages@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          project-dir: .
          package-name: weaverd
          bin-name: weaverd
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          formats: deb,rpm
          maintainer: ${{ env.MAINTAINER }}
          homepage: ${{ env.HOMEPAGE }}
          description: ${{ env.DESCRIPTION }} - daemon
          license: ISC
          man-paths: target/generated-man/${{ inputs.target }}/release/weaverd.1
          outdir: dist

      - name: Prune packaging metadata
        if: inputs.platform == 'linux'
        shell: bash
        run: rm -rf dist/.man dist/nfpm.yaml

      # macOS packaging
      - name: Resolve macOS staging target
        if: inputs.platform == 'macos'
        id: macos-target
        shell: bash
        env:
          ARTEFACT_SUFFIX: ${{ inputs.artifact-suffix }}
        run: |
          set -euo pipefail
          case "$ARTEFACT_SUFFIX" in
            macos-arm64)
              echo "target=macos-aarch64" >>"$GITHUB_OUTPUT"
              ;;
            macos-x86_64)
              echo "target=macos-x86_64" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported artefact suffix: $ARTEFACT_SUFFIX" >&2
              exit 1
              ;;
          esac

      - name: Stage weaver-cli artefacts for macOS
        if: inputs.platform == 'macos'
        id: stage-weaver-cli
        uses: leynos/shared-actions/.github/actions/stage-release-artefacts@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          config-file: .github/release-staging.toml
          target: ${{ steps.macos-target.outputs.target }}

      - name: Build weaver-cli macOS installer package
        if: inputs.platform == 'macos'
        id: package-weaver-cli-macos
        uses: leynos/shared-actions/.github/actions/macos-package@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          name: weaver-cli
          identifier: ${{ env.MAC_IDENTIFIER }}.cli
          binary: ${{ steps.stage-weaver-cli.outputs.binary-path }}
          manpage: ${{ steps.stage-weaver-cli.outputs.man-path }}
          license-file: LICENSE
          version: ${{ inputs.version }}

      - name: Stamp weaver-cli architecture into package name
        if: inputs.platform == 'macos'
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ inputs.artifact-suffix }}
          PKG_PATH: ${{ steps.package-weaver-cli-macos.outputs.pkg-path }}
        run: |
          set -euo pipefail
          dest="dist/weaver-cli-${VERSION}-${ARCHIVE_SUFFIX}.pkg"
          mkdir -p "$(dirname "$dest")"
          mv "$PKG_PATH" "$dest"

      - name: Stage weaverd artefacts for macOS
        if: inputs.platform == 'macos'
        id: stage-weaverd
        uses: leynos/shared-actions/.github/actions/stage-release-artefacts@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          config-file: .github/release-staging-weaverd.toml
          target: ${{ steps.macos-target.outputs.target }}

      - name: Build weaverd macOS installer package
        if: inputs.platform == 'macos'
        id: package-weaverd-macos
        uses: leynos/shared-actions/.github/actions/macos-package@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          name: weaverd
          identifier: ${{ env.MAC_IDENTIFIER }}.daemon
          binary: ${{ steps.stage-weaverd.outputs.binary-path }}
          license-file: LICENSE
          version: ${{ inputs.version }}

      - name: Stamp weaverd architecture into package name
        if: inputs.platform == 'macos'
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ inputs.artifact-suffix }}
          PKG_PATH: ${{ steps.package-weaverd-macos.outputs.pkg-path }}
        run: |
          set -euo pipefail
          dest="dist/weaverd-${VERSION}-${ARCHIVE_SUFFIX}.pkg"
          mkdir -p "$(dirname "$dest")"
          mv "$PKG_PATH" "$dest"

      # FreeBSD: stage raw binaries with checksums
      - name: Stage FreeBSD artefacts
        if: inputs.platform == 'freebsd'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/freebsd-amd64

          for bin in weaver weaverd; do
            src="target/${{ inputs.target }}/release/${bin}"
            if [[ -f "$src" ]]; then
              dest="dist/freebsd-amd64/${bin}"
              cp "$src" "$dest"
              sha256sum "$dest" > "${dest}.sha256"
            fi
          done

      # Upload artefacts
      - name: Upload artefacts
        if: >-
          inputs.should-upload-workflow-artifacts &&
          (inputs.platform == 'linux' ||
          inputs.platform == 'macos' ||
          inputs.platform == 'freebsd')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
