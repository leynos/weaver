name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    # Birdcage needs UID/GID mapping inside a user namespace. Ubicloud denied
    # the UID-map write; ubuntu-latest's unchanged sandbox trial failed with
    # EPERM. The ubuntu-22.04 diagnostic passed. Use this
    # runner for forks, same-repository pull requests, and dispatches so the
    # complete blocking gate exercises the required sandbox behaviour.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install uv
        uses: astral-sh/setup-uv@4cda7d73322c50eac316ad623a716f09a2db2ac7
        # v3.1.2
        with:
          python-version: '3.11'
      - name: Spelling (en-GB-oxendict)
        run: make spelling
      - name: Install bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76  # v2
        with:
          bun-version: '1.2.21'
      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version
      # Merman comes from its checksum-verified release archive. `cargo
      # install merman-cli` compiled it from crates.io on every run, 2.6
      # minutes of a 13-minute job. Nixie installs on the action's default
      # Python 3.14, which nixie-cli 1.1.0 requires; the uv setup above does
      # not provide it, so uv fetches a managed 3.14 for the tool, as the
      # step this replaces already did.
      - name: Install Nixie and Merman
        uses: leynos/shared-actions/.github/actions/install-nixie@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          nixie-version: '1.1.0'
          merman-version: '0.7.0'
      - name: Mermaid lint
        run: make nixie
      - name: Boundary manifest gate
        run: cargo test -p weaver-docs-gate --test boundary_manifest -- --nocapture
      # `make lint` selects the development fragment on this Linux runner.
      # Provision the repository toolchain before installing Whitaker's
      # separate lint toolchain.
      - name: Provision development backend and linker
        run: |
          set -euo pipefail
          rustup component add rustc-codegen-cranelift
          sudo apt-get update
          sudo apt-get install --yes mold
      # The prebuilt lint suite and Dylint tools from Whitaker's rolling
      # release, digest-verified. The action's ci-mode, on by default, fails
      # the step if the installer falls back to a source build, which is what
      # this step used to do on every run.
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          installer-version: '0.2.8'
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # No CodeScene step belongs in this workflow. The CodeScene
      # command-line tool is installed from a URL at job time and is not
      # pinned to a service contract: it calls CodeScene's API, and a change
      # in what that returns fails this lane for a reason no change here
      # caused. The upload
      # happens once, on push to main, in coverage-main.yml; the
      # changed-line gate a reviewer sees is CodeScene's own check against
      # that upload and needs nothing from here.
      # Asserted by tests/workflow_contracts/ci_codescene_placement_test.py.
