name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # The developer-blocking lane, and the one the placement rule moves. It
    # waited 435 s for a GitHub-hosted runner on 2026-09-16 to do 938 s of
    # work.
    #
    # Four vCPU rather than two. This lane builds Whitaker from source with
    # Cranelift and then runs Clippy, Mermaid validation and the coverage
    # suite, which includes two trybuild cases that spawn their own cargo
    # builds. Ubicloud's four vCPU are already 1.5 to 2 times slower than a
    # GitHub public runner's four for that kind of work (measured on
    # wireframe), so two would roughly triple a fifteen-minute lane.
    #
    # A pull request from a fork cannot obtain an Ubicloud runner, so the
    # expression falls back to a GitHub-hosted one for forks only. The
    # continuation line sits at the SAME indent as the line above it: a
    # more-indented continuation in a folded scalar keeps its line break and
    # puts a newline inside the expression, which GitHub evaluates anyway, so
    # a green run would not show it. On a `workflow_dispatch` the fork field
    # is absent and the expression selects the Ubicloud arm, which is right:
    # a dispatch is not a fork.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_REV: 2bc0c3fafb86914f14bd73461a511588841f0a34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Ubicloud runs a cache proxy on the runner's private network, and the
      # runner exposes its URL and token to action steps only. This
      # republishes them through the job environment and clears
      # ACTIONS_CACHE_SERVICE_V2, which sccache's backend reads to select the
      # v2 service that the proxy does not implement. Without it sccache
      # reaches GitHub's cache endpoint from an Ubicloud runner instead.
      #
      # Ordering is load-bearing: sccache reads its cache configuration when
      # its server starts and keeps it for that server's life, so this must
      # precede the step that configures and starts it.
      #
      # The action fails closed on a GitHub-hosted runner rather than
      # exporting that runner's endpoint under Ubicloud's name, so the guard
      # is required wherever the lane can land on either. `runner.environment`
      # is the runtime fact rather than a reading of the label, and it
      # resolves to `self-hosted` on Ubicloud.
      - name: Export Ubicloud cache credentials
        if: runner.environment == 'self-hosted'
        uses: leynos/shared-actions/.github/actions/export-ubicloud-cache-credentials@2a910bfcfd1ea4216419f9290331785f05b33320
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@2a910bfcfd1ea4216419f9290331785f05b33320
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@2a910bfcfd1ea4216419f9290331785f05b33320
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        # v3.1.2
        with:
          python-version: '3.11'
      - name: Spelling (en-GB-oxendict)
        run: make spelling
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'
      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version
      - name: Install Nixie
        run: uv tool install nixie-cli==1.1.0
      - name: Install Merman CLI
        run: cargo install merman-cli --version '=0.7.0' --locked
      - name: Mermaid lint
        run: make nixie
      - name: Boundary manifest gate
        run: cargo test -p weaver-docs-gate --test boundary_manifest -- --nocapture
      - name: Install Whitaker
        run: |
          cargo install --locked \
            --git https://github.com/leynos/whitaker \
            --rev "${WHITAKER_REV}" \
            whitaker-installer
          whitaker_source_dir="${XDG_DATA_HOME:-${HOME}/.local/share}/whitaker"
          mkdir -p "$(dirname "${whitaker_source_dir}")"
          git clone https://github.com/leynos/whitaker "${whitaker_source_dir}"
          git -C "${whitaker_source_dir}" checkout --detach "${WHITAKER_REV}"
          whitaker-installer --build-only --no-update --cranelift
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@2a910bfcfd1ea4216419f9290331785f05b33320
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # The ratchet reads this report; nothing else does, so it is not
          # published as an artefact. The input exists from shared-actions
          # a5765019, which is why this action is pinned there.
          publish-artefact: 'false'
      # No CodeScene step belongs in this workflow. The CodeScene
      # command-line tool is installed from a URL at job time and is not
      # pinned to a service contract: it calls CodeScene's API, and a change
      # in what that returns fails this lane for a reason no change here
      # caused. The upload
      # happens once, on push to main, in coverage-main.yml; the
      # changed-line gate a reviewer sees is CodeScene's own check against
      # that upload and needs nothing from here.
      # Asserted by tests/workflow_contracts/ci_codescene_placement_test.py.
