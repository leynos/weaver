name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_REV: 2bc0c3fafb86914f14bd73461a511588841f0a34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        # v3.1.2
        with:
          python-version: '3.11'
      - name: Spelling (en-GB-oxendict)
        run: make typos
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'
      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version
      - name: Install Nixie
        run: uv tool install nixie-cli==1.1.0
      - name: Install Merman CLI
        run: cargo install merman-cli --version '=0.7.0' --locked
      - name: Mermaid lint
        run: make nixie
      - name: Boundary manifest gate
        run: cargo test -p weaver-docs-gate --test boundary_manifest -- --nocapture
      - name: Install Whitaker
        run: |
          cargo install --locked \
            --git https://github.com/leynos/whitaker \
            --rev "${WHITAKER_REV}" \
            whitaker-installer
          whitaker_source_dir="${XDG_DATA_HOME:-${HOME}/.local/share}/whitaker"
          mkdir -p "$(dirname "${whitaker_source_dir}")"
          git clone https://github.com/leynos/whitaker "${whitaker_source_dir}"
          git -C "${whitaker_source_dir}" checkout --detach "${WHITAKER_REV}"
          whitaker-installer --build-only --no-update --cranelift
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/71837
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
