name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    # The developer-blocking lane, and the one the placement rule moves. It
    # waited 435 s for a GitHub-hosted runner on 2026-09-16 to do 938 s of
    # work.
    #
    # Four vCPU rather than two. This lane builds Whitaker from source with
    # Cranelift and then runs Clippy, Mermaid validation and the coverage
    # suite, which includes two trybuild cases that spawn their own cargo
    # builds. Ubicloud's four vCPU are already 1.5 to 2 times slower than a
    # GitHub public runner's four for that kind of work (measured on
    # wireframe), so two would roughly triple a fifteen-minute lane.
    #
    # A pull request from a fork cannot obtain an Ubicloud runner, so the
    # expression falls back to a GitHub-hosted one for forks only. The
    # continuation line sits at the SAME indent as the line above it: a
    # more-indented continuation in a folded scalar keeps its line break and
    # puts a newline inside the expression, which GitHub evaluates anyway, so
    # a green run would not show it. On a `workflow_dispatch` the fork field
    # is absent and the expression selects the Ubicloud arm, which is right:
    # a dispatch is not a fork.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_REV: 2bc0c3fafb86914f14bd73461a511588841f0a34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@a5765019912a8ab6882b12db049c7cde635f3a85
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        # v3.1.2
        with:
          python-version: '3.11'
      - name: Spelling (en-GB-oxendict)
        run: make spelling
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'
      - name: Install Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version
      - name: Install Nixie
        run: uv tool install nixie-cli==1.1.0
      - name: Install Merman CLI
        run: cargo install merman-cli --version '=0.7.0' --locked
      - name: Mermaid lint
        run: make nixie
      - name: Boundary manifest gate
        run: cargo test -p weaver-docs-gate --test boundary_manifest -- --nocapture
      - name: Install Whitaker
        run: |
          cargo install --locked \
            --git https://github.com/leynos/whitaker \
            --rev "${WHITAKER_REV}" \
            whitaker-installer
          whitaker_source_dir="${XDG_DATA_HOME:-${HOME}/.local/share}/whitaker"
          mkdir -p "$(dirname "${whitaker_source_dir}")"
          git clone https://github.com/leynos/whitaker "${whitaker_source_dir}"
          git -C "${whitaker_source_dir}" checkout --detach "${WHITAKER_REV}"
          whitaker-installer --build-only --no-update --cranelift
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/71837
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
