---
name: Release Binary

'on':
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      publish:
        description: >-
          Whether the workflow should publish artefacts to the GitHub release
          associated with the tag. Defaults to `false` when invoked as a
          reusable workflow.
        required: false
        type: boolean
        default: false
      dry-run:
        description: >-
          When `true`, build artefacts without uploading them to GitHub
          releases or workflow artefacts.
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: Crate version resolved from Cargo.toml
        value: ${{ jobs.metadata.outputs.version }}
      should_publish:
        description: Whether artefacts should be published to the release
        value: ${{ jobs.metadata.outputs.should_publish }}
      dry_run:
        description: Whether the workflow is running in dry-run mode
        value: ${{ jobs.metadata.outputs.dry_run }}
      should_upload_workflow_artifacts:
        description: Whether workflow artefact uploads are enabled
        value: ${{ jobs.metadata.outputs.should_upload_workflow_artifacts }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    # Reads the crate version and resolves the release modes: 14 s of work on
    # 2026-09-16. It carries the fork fallback even though this is nominally a
    # tag workflow, because `release-dry-run.yml` calls it on every pull
    # request, so it does meet forks. The continuation line sits at the SAME
    # indent as the line above it; a more-indented continuation in a folded
    # scalar keeps its line break and puts a newline inside the expression.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ensure_version.outputs.crate-version }}
      should_publish: ${{ steps.release_modes.outputs.should-publish }}
      dry_run: ${{ steps.release_modes.outputs.dry-run }}
      should_upload_workflow_artifacts: ${{ steps.release_modes.outputs.should-upload-workflow-artifacts }}
      repo_name: ${{ steps.repo_name.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        # v7.0.0
      - id: repo_name
        name: Determine repository name
        run: echo "value=${GITHUB_REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
      - id: release_modes
        name: Determine release modes
        uses: leynos/shared-actions/.github/actions/determine-release-modes@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          dry-run: ${{ inputs.dry-run }}
          publish: ${{ inputs.publish }}
      - id: ensure_version
        name: Read package version from Cargo.toml
        uses: leynos/shared-actions/.github/actions/ensure-cargo-version@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          check-tag: ${{ fromJSON(steps.release_modes.outputs.should-publish) }}
          manifests: crates/weaver-cli/Cargo.toml

  build-linux:
    needs: metadata
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artefact: linux-amd64
          - target: aarch64-unknown-linux-gnu
            artefact: linux-arm64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: linux
      # `release-dry-run.yml` calls this workflow on every pull request, so
      # these are pull-request lanes despite living in a release workflow, and
      # they were the longest wait in the repository: 1782 s and 1442 s of
      # queueing on 2026-09-16 to do 198 s and 219 s of work.
      #
      # The fallback goes in the caller's `with:` block rather than on a
      # `runs-on` line, because the runner is a `workflow_call` input. The
      # continuation sits at the same indent as the line above it for the same
      # folded-scalar reason as everywhere else.
      runner: >-
        ${{ github.event.pull_request.head.repo.fork
        && 'ubuntu-latest' || 'ubicloud-standard-4' }}
      target: ${{ matrix.target }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artefact }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}

  build-macos:
    needs: metadata
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            artefact_suffix: macos-x86_64
          - target: aarch64-apple-darwin
            artefact_suffix: macos-arm64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: macos
      # Stays GitHub-hosted: a macOS build needs a macOS runner and Ubicloud
      # offer none, so there is no fork arm to write. The contract pins this
      # label by coordinate so the absence reads as a decision.
      runner: macos-15
      target: ${{ matrix.target }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artefact_suffix }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      artifact-suffix: ${{ matrix.artefact_suffix }}

  build-freebsd:
    # Temporarily disabled until FreeBSD release builds can be validated.
    if: ${{ vars.ENABLE_FREEBSD_RELEASE_BUILDS == 'true' }}
    needs: metadata
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: freebsd
      # Deliberately left on `ubuntu-latest` while the Linux legs move. This
      # job is switched off by the `ENABLE_FREEBSD_RELEASE_BUILDS` repository
      # variable, so it has never run: there is nothing to measure, nothing to
      # speed up, and no way to test that a move worked. Moving it would be a
      # change to dead code. It is pinned here by coordinate so the choice
      # reads as one, and it moves when somebody re-enables the leg and can
      # watch it run.
      runner: ubuntu-latest
      target: x86_64-unknown-freebsd
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-freebsd-amd64
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}

  release:
    if: ${{ always() && needs.metadata.outputs.should_publish == 'true' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && (needs.build-freebsd.result == 'success' || needs.build-freebsd.result == 'skipped') }}
    permissions:
      contents: write
    needs:
      - metadata
      - build-linux
      - build-macos
      - build-freebsd
    # No fork arm: this job is gated on `should_publish`, which is only true
    # on a tag push, so it is skipped on every dry run and never meets a fork.
    #
    # The ceiling is a judgement, not a measurement, and is recorded as one:
    # because the job is skipped on every dry run, no green run of it exists
    # to size from. Fifteen minutes is generous for creating a draft release
    # and uploading the staged artefacts, and can be re-sized from the first
    # real tag.
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        # v7.0.0
      - name: Ensure release exists (draft)
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --draft \
              --verify-tag \
              --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # v8.0.1
        with:
          path: dist
          pattern: ${{ needs.metadata.outputs.repo_name }}-*
      - id: upload_assets
        name: Upload artefacts to release
        uses: leynos/shared-actions/.github/actions/upload-release-assets@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          release-tag: ${{ github.ref_name }}
          bin-name: weaver
          dist-dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check asset upload errors
        if: steps.upload_assets.outputs.upload-error == 'true'
        env:
          ERROR_MESSAGE: ${{ steps.upload_assets.outputs.error-message }}
        run: |
          echo "Error uploading release assets:"
          printf '%s\n' "$ERROR_MESSAGE"
          exit 1
