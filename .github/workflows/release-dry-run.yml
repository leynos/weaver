---
name: Release Dry Run

# Rehearses the release on every pull request by calling `release.yml` with
# `dry-run: true`, so a change that would break the release is found before
# the tag is pushed. It runs on pull requests, so it forwards no secrets:
# `release.yml` reads only `secrets.GITHUB_TOKEN`, which a called workflow
# receives without being forwarded it. tests/workflow_contracts holds the rule
# that no pull-request call inherits secrets.

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      dry-run: true
    # This workflow runs on pull requests, so it forwards no secrets. The
    # release workflow reads only `secrets.GITHUB_TOKEN`, which a called
    # workflow receives without forwarding, so `secrets: inherit` would
    # only widen what a pull request can reach.
