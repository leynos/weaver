# Repository-wide Cargo defaults for the development build standard.
#
# The parallel `rustc` frontend is the default for every build, and the mold
# linker is the default on Linux. Cargo auto-discovers this file, so a bare
# `cargo build` gets both. Cranelift is deliberately not the development
# backend: the suite fails under it on the pinned toolchain (developers' guide,
# "The Cranelift codegen backend exception"), and
# `tests/workflow_contracts/build_footprint_test.py` refuses the key.
# `make release` and coverage assign `RUSTFLAGS`, which displaces every
# `rustflags` source below, so neither adds the frontend flag or mold (a flag the
# caller exports still survives).
# Cargo does not select `rustflags` by profile, so a bare
# `cargo build --release` takes both; build releases through `make release`.
#
# Cargo selects a single `rustflags` source rather than merging them: a
# matching `[target.*]` table replaces `[build] rustflags` outright. Every flag
# is therefore repeated in each source, and the Makefile restates them where it
# assigns `RUSTFLAGS` for the gate targets.

# Dev-build footprint (DF-003): on the dated nightly pins from 2026-07-31 the
# native key stops Cargo embedding metadata in rlibs. Never use raw rustc
# metadata flags; they broke build scripts.
[unstable]
embed-metadata = false

[build]
rustflags = ["-Zthreads=8"]

# mold ships for Linux only, so the linker flag is gated behind a target `cfg`.
# macOS and Windows fall through to `[build] rustflags` above and use their
# platform default linker.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-Clink-arg=-fuse-ld=mold"]
