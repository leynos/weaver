# cargo-nextest configuration for Weaver.
#
# Setup scripts are an experimental nextest feature; the `[scripts.setup.*]`
# tables below need this opt-in.
experimental = ["setup-scripts"]
#
# Scope: every `cargo nextest` invocation, including `make test` and the
# coverage lane. nextest does not run doctests, which `make test` runs
# separately with `cargo test --doc`.
#
# Policy: no blanket retries. A test that fails intermittently is a defect to
# diagnose, not to paper over with re-runs.

[profile.default]
# Surface hangs without failing legitimately slow suites. Warn after 60 s and
# terminate a test that has run for three warning periods (180 s), the limit
# CI applied before this file existed. This governs every test no override
# matches; none of them starts a compiler.
slow-timeout = { period = "60s", terminate-after = 3 }
# The whole run, kept below the coverage job's 20-minute limit and its cargo
# watchdog so nextest reports the overrun itself rather than the job being
# cancelled. Measured: the workspace's 1,558 tests took 234 s on CI.
global-timeout = "15m"

[test-groups.nested-cargo-builds]
# These tests start a child `cargo` or `rustc` of their own: the trybuild
# suites, a downstream-crate build, and the manifest renderer example. Each
# pays for Cargo's package-cache and build-directory locks and for compiler
# work inside its own allowance, so run beside each other they block on the
# same locks and a cold build looks like a hang. One at a time, each is bounded
# by its own work.
max-threads = 1

[[profile.default.overrides]]
# `load_manifest` runs the renderer example through `cargo`, the
# `missing_docs_policy` contract drives `trybuild`, and both
# `compile_time` binaries (weaver-docs-gate and weaver-plugins) compile
# fixtures. The end-to-end binaries can also run `cargo build` to find the
# `weaver` binary, but only when it is missing and at most once per process, so
# they stay in the default pool.
#
# Measured on CI: 26 s, 39 s and 85 s for the three slowest of these tests.
# An instrumented from-scratch build is slower, so the allowance is five
# 120-second periods (600 s), which the coverage job's limit still covers.
filter = 'binary(=load_manifest) | binary(=compile_time) | binary(=missing_docs_policy)'
test-group = "nested-cargo-builds"
slow-timeout = { period = "120s", terminate-after = 5 }

# Every test binary selected below compiles something in a nested cargo or
# trybuild build inside its own timed body. If nothing has filled those build
# directories first, the first test to reach each pays a cold dependency build
# and its timeout fails an assertion that is sound. These setup scripts pay for
# the builds once, before any selected test starts, under their own allowance,
# so every timed body then finds the directories warm. (The same move as
# ortho-config #710 and whitaker #518.)
#
# `weaver-binary` builds the `weaver` executable that the end-to-end binaries
# otherwise build on first use, inside whichever test reaches it first. It uses
# the exact flags of `make test` (`CARGO_FLAGS` in the Makefile): a build with
# a different feature set would overwrite `target/debug/weaver` with an
# executable that lacks the features the snapshots need (the Python graph-slice
# snapshots fail), so keep the two in step. After `make test`'s own build it
# finds everything fresh and does no work.
# `nested-cargo-builds` runs the trybuild and example-rendering binaries once.
# A failing test in the warm-up makes the script exit non-zero and nextest then
# runs none of the selected tests, so the run fails with that test's own output.
# `--no-fail-fast` lets the warm-up run every binary first, so the failure list
# is complete. Both commands are `--locked`: the gate has already fetched, so
# neither may resolve or touch the registry.
[scripts.setup.weaver-binary]
command = ["cargo", "build", "--locked", "--workspace", "--all-targets", "--all-features"]
slow-timeout = { period = "300s", terminate-after = 3 }

[scripts.setup.nested-cargo-builds]
command = [
  "cargo",
  "test",
  "--locked",
  "--no-fail-fast",
  "-p",
  "weaver-config",
  "--test",
  "compile_time",
  "-p",
  "weaver-docs-gate",
  "--test",
  "compile_time",
  "--test",
  "load_manifest",
  "-p",
  "weaver-plugins",
  "--test",
  "compile_time",
  "-p",
  "weaver-cli",
  "--test",
  "missing_docs_policy",
]
slow-timeout = { period = "300s", terminate-after = 3 }

[[profile.default.scripts]]
filter = 'package(weaver-e2e)'
setup = "weaver-binary"

[[profile.default.scripts]]
filter = 'binary(=load_manifest) | binary(=compile_time) | binary(=missing_docs_policy)'
setup = "nested-cargo-builds"
