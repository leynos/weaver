# cargo-nextest configuration for Weaver.
#
# Scope: every `cargo nextest` invocation, including `make test` and the
# coverage lane. nextest does not run doctests, which `make test` runs
# separately with `cargo test --doc`.
#
# Policy: no blanket retries. A test that fails intermittently is a defect to
# diagnose, not to paper over with re-runs.

[profile.default]
# Surface hangs without failing legitimately slow suites. Warn after 60 s and
# terminate a test that has run for three warning periods (180 s), the limit
# CI applied before this file existed. This governs every test no override
# matches; none of them starts a compiler.
slow-timeout = { period = "60s", terminate-after = 3 }
# The whole run, kept below the coverage job's 20-minute limit and its cargo
# watchdog so nextest reports the overrun itself rather than the job being
# cancelled. Measured: the workspace's 1,558 tests took 234 s on CI.
global-timeout = "15m"

[test-groups.nested-cargo-builds]
# These tests start a child `cargo` or `rustc` of their own: the trybuild
# suites, a downstream-crate build, and the manifest renderer example. Each
# pays for Cargo's package-cache and build-directory locks and for compiler
# work inside its own allowance, so run beside each other they block on the
# same locks and a cold build looks like a hang. One at a time, each is bounded
# by its own work.
max-threads = 1

[[profile.default.overrides]]
# `load_manifest` runs the renderer example through `cargo`, and both
# `compile_time` binaries (weaver-docs-gate and weaver-plugins) compile
# fixtures. The end-to-end binaries can also run `cargo build` to find the
# `weaver` binary, but only when it is missing and at most once per process, so
# they stay in the default pool.
#
# Measured on CI: 26 s, 39 s and 85 s for the three slowest of these tests.
# An instrumented from-scratch build is slower, so the allowance is five
# 120-second periods (600 s), which the coverage job's limit still covers.
filter = 'binary(=load_manifest) | binary(=compile_time)'
test-group = "nested-cargo-builds"
slow-timeout = { period = "120s", terminate-after = 5 }
