# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Ignore inline code and preserve formal names without accepting components
# broadly. Inline code spans were masked by the previous dictionary snapshot;
# kept until the shared dictionary rules on it.
ignore = [
  "`[^`\\n]+`",
  "\\brust-analyzer\\b",
  "\\bRust\\s+Analyzer\\b",
  "\\bHashiCorp\\b",
  "\\bHashiCorp\\s+Configuration\\s+Language\\b",
  "\\bGitHub\\s+Flavored\\s+Markdown\\b",

  "(?m)^          inputs\\.should-upload-workflow-artifacts &&$",
  "(?m)^        value: \\$\\{\\{ jobs\\.metadata\\.outputs\\.should_upload_workflow_artifacts \\}\\}$",
  "(?m)^      should-upload-workflow-artifacts: \\$\\{\\{ fromJSON\\(needs\\.metadata\\.outputs\\.should_upload_workflow_artifacts\\) \\}\\}$",
  "(?m)^      should-upload-workflow-artifacts:$",
  "(?m)^      should_upload_workflow_artifacts: \\$\\{\\{ steps\\.release_modes\\.outputs\\.should-upload-workflow-artifacts \\}\\}$",
  "(?m)^      should_upload_workflow_artifacts:$",
  # Mask multiline code spans and shorter runs inside longer delimiters. The
  # builder's regex-safety check rejects the previous single alternation, so
  # the same spans are masked by separate, non-nested patterns. Fenced blocks
  # are already masked by the shared dictionary.
  "(?s)``.*?``",
  "`[^`]+`",
  "\\bartifact-name\\b",
  "\\bartifact-suffix\\b",
]

[files]
exclude = []
